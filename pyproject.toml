[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vera-grounded-bot"
version = "0.1.3"
description = "Evaluation-first bot for the magicpin Vera AI challenge"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "orjson>=3.10,<4",
  "pydantic>=2.10,<3",
  "pydantic-ai-slim[google,retries]>=2.33,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.100,<7",
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
